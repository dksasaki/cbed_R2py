[stitch]
mom6_template = "data/cache/scratch_test/mom6.nc"
cbed_pattern  = "data/cache/cbed*.nc"
output        = "data/cbed_results.nc"

[chunks]
nx = 5
ny = 1

[cbed]
# method = "steady_state"   CBED v2 steady state (cbed2py/model/cbed_v2_func.R in
#                           cbedr2py_1d) with the time-mean forcing
# method = "newton_krylov"  cbed2py transient model spun up to its periodic state
#                           under the one-year climatology of the forcing
#                           (Jacobian-free Newton-Krylov, cbed2py.spinup)
method = "newton_krylov"
model  = "fast"             # cbed2py model for newton_krylov: "fast" (~7x quicker) or "v2"

# cbed2py parameter overrides (newton_krylov only). The point setup (forcing,
# porosity, temp, S, w, depth, f.OM1-3) is set by cbed_wrapper.py as for
# steady_state.
[cbed.params]
jpoc_mode_reactivity    = "instantaneous"   # instantaneous | longterm_mean | trailing_mean
jpoc_mode_bioturbation  = "instantaneous"
jpoc_mode_bioirrigation = "instantaneous"

# keywords of cbed2py.spinup.newton_krylov_spinup (newton_krylov only)
[cbed.spinup]
n_periods     = 1           # years per shot; longer shots (5-10) help slow-OM points
                            # converge, but each Newton step costs n_periods times more
max_newton    = 10          # the test point needed 8
gmres_iter    = 20
tol_imbalance = 0.05        # umol C cm-2 yr-1
tol_f         = 3e-5
n_sub         = 12
scale_abs     = 1e-3        # minimum scale of each unknown (state units), so a
                            # species ~0 at the start (e.g. ODU) does not swamp ||G||
