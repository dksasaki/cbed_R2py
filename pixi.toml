[workspace]
authors = ["dksasaki <dalton.sasaki@gmail.com>"]
channels = ["conda-forge"]
name = "cbed_R_py"
platforms = ["linux-64"]
version = "0.1.0"


[dependencies]
python     = "==3.11"
numpy      = "==1.26.0"
pandas     = "*"
rpy2       = "*"
r-base = "*"
r-desolve = "*"
r-rootsolve = "*"
r-readxl = "*"
ipython  = "*"
matplotlib = "*"
hdf5       = "*"
bottleneck = "*"
pyreadr    = "*"
xarray     = "==2023.10.1"
dask       = "==2023.10.1"
netcdf4    = "==1.6.5"
xesmf      = "*"
esmpy      = ">=8.5"

[pypi-dependencies]
# CBED model (cbedr2py_1d), pinned to a commit of branch dev_new_methods.
# Local clone instead: cbed2py = { path = "../cbedr2py_1d", editable = true }
cbed2py = { git = "https://github.com/dksasaki/cbedr2py_1d", rev = "ec8746ed058f5acd451850108ba0006403bbc6d3" }

[tasks]
setup-r = "Rscript -e \"install.packages(c('ReacTran', 'marelac'), repos='https://cloud.r-project.org')\""