[workspace]
authors = ["dksasaki <dalton.sasaki@gmail.com>"]
channels = ["conda-forge"]
name = "cbed_R_py"
platforms = ["linux-64"]
version = "0.1.0"


[dependencies]
python     = "==3.11"
numpy      = "==1.26.0"
pandas     = "*"
rpy2       = "*"
r-base = "*"
r-desolve = "*"
r-rootsolve = "*"
r-readxl = "*"
ipython  = "*"
matplotlib = "*"
hdf5       = "*"
bottleneck = "*"
pyreadr    = "*"
xarray     = "==2023.10.1"
dask       = "==2023.10.1"
netcdf4    = "==1.6.5"
xesmf      = "*"
esmpy      = ">=8.5"

[pypi-dependencies]
# cbed2py (transient CBED + Newton-Krylov spin-up), used by [cbed] method = "newton_krylov".
# Expects cbedr2py_1d cloned next to this repository.
cbed2py = { path = "../cbedr2py_1d", editable = true }

[tasks]
setup-r = "Rscript -e \"install.packages(c('ReacTran', 'marelac'), repos='https://cloud.r-project.org')\""